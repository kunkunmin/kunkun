name: Deploy AI Topic Radar

on:
  push:
    branches:
      - main
    paths:
      - "ai_topic_radar/index.html"
      - "ai_topic_radar/web.css"
      - "ai_topic_radar/web.js"
      - ".github/workflows/deploy-ai-topic-radar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p site
          cp ai_topic_radar/index.html site/index.html
          cp ai_topic_radar/web.css site/web.css
          cp ai_topic_radar/web.js site/web.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
